<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e85d04" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Border Frame (Neo-brutalist) -->
  <rect x="20" y="20" width="1160" height="590" rx="4" fill="none" stroke="#e85d04" stroke-width="6"/>

  <!-- Top Badge -->
  <g transform="translate(60, 65)">
    <rect width="440" height="42" rx="4" fill="#16213e" stroke="#e85d04" stroke-width="3"/>
    <text x="20" y="27" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="900" fill="#0d9488" letter-spacing="1.5">SURAT'S TRENDING IT &amp; FULL-STACK NETWORK</text>
  </g>

  <!-- Title Pill: Yash Bhut -->
  <g transform="translate(60, 140)">
    <rect x="6" y="6" width="360" height="74" rx="4" fill="#000000"/>
    <rect x="0" y="0" width="360" height="74" rx="4" fill="#e85d04" stroke="#000000" stroke-width="3"/>
    <text x="30" y="52" font-family="'Montserrat', system-ui, sans-serif" font-size="46" font-weight="900" fill="#000000">YASH BHUT</text>
  </g>

  <!-- Subtitle Heading -->
  <text x="60" y="270" font-family="'Montserrat', system-ui, sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Full-Stack Software Engineer &amp; Tech Architect</text>

  <!-- Location & Short Bio -->
  <text x="60" y="325" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="600" fill="#cbd5e1">Surat, India / Remote — Building High-Performance Web Engines &amp; Microservices</text>

  <!-- Tech Badges Container -->
  <g transform="translate(60, 375)">
    <!-- Badge 1: MERN & Next.js -->
    <g transform="translate(0, 0)">
      <rect width="210" height="44" rx="4" fill="#16213e" stroke="#e85d04" stroke-width="2"/>
      <text x="20" y="28" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">React 19 &amp; Next.js</text>
    </g>

    <!-- Badge 2: TypeScript -->
    <g transform="translate(225, 0)">
      <rect width="160" height="44" rx="4" fill="#0d9488" stroke="#000000" stroke-width="2"/>
      <text x="20" y="28" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">TypeScript</text>
    </g>

    <!-- Badge 3: Node.js & Python -->
    <g transform="translate(400, 0)">
      <rect width="210" height="44" rx="4" fill="#16213e" stroke="#e85d04" stroke-width="2"/>
      <text x="20" y="28" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Node.js &amp; Python</text>
    </g>

    <!-- Badge 4: WebSockets & Redis -->
    <g transform="translate(625, 0)">
      <rect width="230" height="44" rx="4" fill="#16213e" stroke="#e85d04" stroke-width="2"/>
      <text x="20" y="28" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">WebSockets &amp; Redis</text>
    </g>

    <!-- Badge 5: PostgreSQL & Cloud -->
    <g transform="translate(870, 0)">
      <rect width="210" height="44" rx="4" fill="#16213e" stroke="#e85d04" stroke-width="2"/>
      <text x="20" y="28" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">PostgreSQL &amp; Cloud</text>
    </g>
  </g>

  <!-- Bottom CTA Banner -->
  <g transform="translate(60, 480)">
    <rect width="1080" height="75" rx="4" fill="#16213e" stroke="#e85d04" stroke-width="3"/>
    <text x="30" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="800" fill="#e85d04">https://yashbhut.in</text>
    <text x="750" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">GitHub: @yashubhut-cpu</text>
  </g>
</svg>
