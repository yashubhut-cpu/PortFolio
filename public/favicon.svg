<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      .bg-tile { fill: #e85d04; stroke: #000000; stroke-width: 18px; }
      .shadow-tile { fill: #000000; }
      .text-monogram { fill: #1a1a2e; font-family: 'Space Grotesk', 'Montserrat', system-ui, -apple-system, sans-serif; font-weight: 900; }
      .accent-prompt { stroke: #1a1a2e; fill: none; stroke-width: 24px; stroke-linecap: round; stroke-linejoin: round; }
      .accent-cursor { fill: #1a1a2e; }

      @media (prefers-color-scheme: dark) {
        .shadow-tile { fill: #0f172a; }
      }
    </style>
  </defs>

  <!-- Neo-Brutalist Hard Shadow & Brand Orange Tile -->
  <rect class="shadow-tile" x="36" y="36" width="440" height="440" rx="44" />
  <rect class="bg-tile" x="24" y="24" width="440" height="440" rx="44" />
  
  <!-- Top Specular Highlight -->
  <rect x="44" y="44" width="400" height="16" rx="8" fill="#ffffff" fill-opacity="0.3" />

  <!-- Monogram YB -->
  <text 
    class="text-monogram"
    x="100" 
    y="325" 
    font-size="230" 
    letter-spacing="-12"
  >YB</text>

  <!-- Terminal Code Cursor Accent (>_) -->
  <path class="accent-prompt" d="M 370 230 L 400 250 L 370 270" />
  <rect class="accent-cursor" x="370" y="295" width="34" height="16" rx="4" />
</svg>
