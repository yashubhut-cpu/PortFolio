<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Neo-Brutalist Hard Shadow & Orange Tile -->
  <rect x="48" y="48" width="432" height="432" rx="48" fill="#1a1a2e" />
  <rect x="32" y="32" width="432" height="432" rx="48" fill="#e85d04" stroke="#000000" stroke-width="20" />
  
  <!-- Subtle Top Highlight -->
  <rect x="48" y="48" width="400" height="20" rx="10" fill="#ffffff" fill-opacity="0.25" />

  <!-- Monogram YB -->
  <text 
    x="120" 
    y="320" 
    font-family="system-ui, -apple-system, 'Space Grotesk', 'Montserrat', sans-serif" 
    font-size="220" 
    font-weight="900" 
    fill="#1a1a2e" 
    letter-spacing="-10"
  >YB</text>

  <!-- Terminal Code Cursor Accent -->
  <rect x="375" y="270" width="36" height="50" rx="6" fill="#1a1a2e" />
</svg>
